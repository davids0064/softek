server.port=8080
spring.application.name=TestApplication

############### base de datos ###############
# Configuracion de H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS DBO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web de H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion de JPA / Hibernate con H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cargar automaticamente schema.sql al arrancar
spring.sql.init.mode=always

########### swagger ###############
springdoc.swagger-ui.path=/swagger-ui.html

# Ordenar los endpoints alfabéticamente por método HTTP
springdoc.swagger-ui.operations-sorter=method